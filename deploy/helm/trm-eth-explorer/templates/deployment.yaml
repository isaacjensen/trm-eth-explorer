apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trm-eth-explorer.fullname" . }}
  labels:
    {{- include "trm-eth-explorer.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # Only set replicas when the HPA isn't managing them, so Helm doesn't fight the HPA.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "trm-eth-explorer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trm-eth-explorer.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "trm-eth-explorer.serviceAccountName" . }}
      # Pod-level hardening.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # matches the distroless :nonroot image
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across AZs so a single zone failure can't take them all.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "trm-eth-explorer.selectorLabels" . | nindent 14 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: NODE_ENV
              value: production
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # Secrets come from the pre-created k8s Secret (CI sources it from Secrets Manager).
            - name: INFURA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: INFURA_API_KEY
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: AUTH_JWT_SECRET
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Container-level hardening.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Writable /tmp because the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
