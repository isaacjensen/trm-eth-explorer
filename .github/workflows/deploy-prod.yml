name: Deploy to production (manual)

# Deliberate, human-triggered promotion to prod — decoupled from staging on purpose.
# Staging auto-deploys on merge (deploy.yml); prod is only ever deployed by manually
# running this workflow and providing the image tag (git SHA) that already built and
# passed staging. It PROMOTES that same image (no rebuild), so prod runs the exact
# artifact that was verified in staging.
#
# Why a manual workflow instead of an approval gate: GitHub's required-reviewer
# environment protection needs a paid plan on private repos, so this manual
# workflow_dispatch IS the gate — someone with repo access must choose to run it.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (git SHA) to promote — must already be in ECR (i.e. it passed staging)"
        required: true

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_SECRET_ID: ${{ vars.APP_SECRET_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Point kubectl at the cluster
        run: aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ vars.EKS_CLUSTER_NAME }}
      - name: Sync k8s Secret from Secrets Manager
        run: ./scripts/sync-secret.sh prod
      - name: Helm deploy (promote the staged image tag — no rebuild)
        run: |
          helm upgrade --install trm-eth-explorer deploy/helm/trm-eth-explorer \
            --namespace prod \
            -f deploy/helm/trm-eth-explorer/values-prod.yaml \
            --set image.repository=${{ vars.ECR_REPOSITORY }} \
            --set image.tag=${{ inputs.image_tag }} \
            --wait --atomic --timeout 5m
      - name: Set up Node (mint-token for the smoke test)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Smoke test (authenticated balance call)
        run: ./scripts/smoke-test.sh prod
